.L{grid-column:1;align-items:flex-start;align-content:flex-start}.R{grid-column:3;align-items:flex-end;align-content:flex-end}

.w{transition:filter .2s}.w:hover{filter:drop-shadow(0 0 8px rgba(6,182,212,.6))}

.kg{display:flex;flex-direction:column;gap:5px}

.hits{grid-column:1/4;grid-row:3;display:flex;gap:6px;margin-bottom:6px}

#pw.on{border-color:var(--c);box-shadow:0 0 12px rgba(6,182,212,.5)}#pw.on svg{stroke:var(--c);filter:drop-shadow(0 0 4px var(--c))}#pw.on i{background:var(--c);box-shadow:0 0 6px var(--c)}

#svt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);z-index:60;width:max-content;max-width:min(92vw,520px);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#060d14;border:1px solid #06b6d4;color:#d7f3ff;font-size:11px;line-height:1.35}
#svt,#svt *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}#svt a{color:#7be7ff;word-break:break-all;text-decoration:underline}/* landscape phones: dial columns sit at the screen edges and the whole centre belongs to the monster and the HUD */
@media (orientation:landscape) and (max-height:520px){#app{grid-template-columns:minmax(var(--sw),auto) minmax(0,1fr) minmax(var(--sw),auto);justify-content:stretch;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}.kg.g2 .kw{justify-self:center}}
/* very short or small-portrait screens: slightly tighter dial spacing so the columns never reach the pads and the HUD keeps its room */
@media (max-height:400px){:root{--mz:26px}.kg{gap:2px}.kw{gap:1px}}
@media (orientation:portrait) and (max-height:780px){:root{--mz:30px}.kg{gap:3px}}
/* short (landscape phone) screens: the busy OUT panels go two chips wide so nothing runs down over the pads and keys */
@media (max-height:520px){.kg.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.kg.g2 .chip{padding:4px 3px;white-space:nowrap}.kg.gs .chip:first-child{grid-column:1/-1}.chip{padding-top:4px;padding-bottom:4px}}
